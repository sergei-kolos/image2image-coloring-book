<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Картины по номерам</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <main class="container">
    <h1>Картины по номерам</h1>
    <form id="convert-form">
      <label class="file">
        <input type="file" id="image" name="image" accept="image/png,image/jpeg,image/webp" required>
        <span id="file-label">Выберите изображение</span>
      </label>
      <div class="preview"><img id="preview" alt="" hidden></div>

      <fieldset class="params">
        <legend>Параметры</legend>
        <label>Детализация: <output id="detail_out">5</output>
          <input type="range" id="detail_level" name="detail_level" min="1" max="15" value="5"></label>
        <label>Макс. цветов: <output id="max_colors_out">64</output>
          <input type="range" id="max_colors" name="max_colors" min="2" max="64" value="64"></label>
        <label>Толщина линий: <input type="number" name="line_thickness" min="0.5" max="3" step="0.1" value="1.0"></label>
        <label>Слияние цветов: <output id="color_merge_out">15</output>
          <input type="range" id="color_merge_threshold" name="color_merge_threshold" min="0" max="80" step="1" value="15"></label>
        <label>Формат:
          <select name="paper_size">
            <option>A3</option>
            <option selected>A4</option>
            <option>A5</option>
            <option>Letter</option>
            <option>Legal</option>
          </select>
        </label>
        <label>Ориентация:
          <select name="orientation">
            <option value="auto" selected>auto</option>
            <option value="portrait">portrait</option>
            <option value="landscape">landscape</option>
          </select>
        </label>
        <label>Номера: <input type="checkbox" name="show_numbers" checked></label>
        <label>Цвет номеров:
          <select name="number_color">
            <option value="black" selected>black</option>
            <option value="gray">gray</option>
          </select>
        </label>
      </fieldset>

      <button type="submit" id="submit">Сгенерировать</button>
      <p id="status" class="status"></p>
    </form>

    <div id="downloads" class="downloads" hidden>
      <button type="button" id="dl-pdf" class="dl-btn">Скачать PDF</button>
    </div>

    <div id="comparison" class="comparison" hidden>
      <div class="panel">
        <h3>С раскраской</h3>
        <img id="after-img" alt="">
        <button type="button" class="dl-img" data-target="after-img">Скачать PNG</button>
      </div>
      <div class="panel">
        <h3>Только контуры</h3>
        <img id="outline-img" alt="">
        <button type="button" class="dl-img" data-target="outline-img">Скачать PNG</button>
      </div>
    </div>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
